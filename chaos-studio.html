<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chaos Studio — Friendship Edition</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--p:#12141d;--l:#262a3a;--t:#f3f4f8;--m:#9aa0b8;--a:#ff5d73;--b:#3dd9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:radial-gradient(900px 480px at 85% -10%,#34173a,transparent),radial-gradient(700px 400px at 0 0,#0c2a3a,transparent),var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}

#stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--l);box-shadow:0 30px 80px #000a,0 0 0 1px #ffffff08 inset}

.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#0007)}

.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}

.card:hover{transform:translateX(3px);border-color:#ffffff40}.card.on{border-color:var(--a);background:linear-gradient(90deg,#ff5d7322,var(--p))}
.card i{font-style:normal;font-weight:800;color:var(--a);font-size:20px;width:26px}.card b{display:block}.card small{color:var(--m)}
.bub2{display:none}
.ev{animation:none}.wv{animation:wv 5s linear infinite}@keyframes wv{to{transform:translateX(-60px)}}

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),bubs=$('#bubs'),capE=$('#cap');
// ---------- characters (rigged SVG: separate torso, head, arms, legs; joints at shoulder/elbow/hip/knee)
const C=(id,sk,ha,tp,bt,g)=>`<g id="${id}"><g class="r">
<g class="a" style="filter:brightness(.78)"><path d="M0 0V28" stroke="${sk}" stroke-width="8" stroke-linecap="round"/><path d="M0 0V13" stroke="${tp}" stroke-width="11" stroke-linecap="round"/><g class="e"><path d="M0 0V26" stroke="${sk}" stroke-width="7" stroke-linecap="round"/><circle cy="27" r="4.5" fill="${sk}"/></g></g>
<g class="ll" style="filter:brightness(.78)"><path d="M0 0V40" stroke="${g?sk:bt}" stroke-width="${g?12:15}" stroke-linecap="round"/><g class="lk"><path d="M0 0V36" stroke="${sk}" stroke-width="10" stroke-linecap="round"/><ellipse cx="5" cy="40" rx="10" ry="5" fill="${g?'#fff':'#e8e8ee'}"/></g></g>
<rect x="-12" y="-58" width="24" height="62" rx="10" fill="${tp}"/>${g?`<path d="M-12 -6L-19 24H19L12 -6z" fill="${bt}"/>`:`<rect x="-13" y="-6" width="26" height="14" rx="6" fill="${bt}"/>`}
<g class="rl"><path d="M0 0V40" stroke="${g?sk:bt}" stroke-width="${g?12:15}" stroke-linecap="round"/><g class="rk"><path d="M0 0V36" stroke="${sk}" stroke-width="10" stroke-linecap="round"/><ellipse cx="5" cy="40" rx="10" ry="5" fill="${g?'#fff':'#e8e8ee'}"/></g></g>
<g class="hd"><rect x="-4" y="-66" width="8" height="10" fill="${sk}"/>${g?`<path d="M-13 -80C-36 -86 -32 -48 -22 -42C-27 -62 -14 -68 -10 -72z" fill="${ha}"/>`:''}<circle cy="-74" r="14" fill="${sk}"/><path d="M-15 -72C-18 -93 13 -96 15 -78C8 -85 -4 -84 -15 -72z" fill="${ha}"/><circle cx="6" cy="-75" r="2" fill="#222"/><path class="br" stroke="#222" stroke-width="1.6" fill="none"/><path d="M13 -74l4 4-4 1" stroke="#0003" fill="none"/><path class="mo" stroke="#7a2a2a" stroke-width="1.8" fill="none"/><g class="cr" opacity="0"><circle cx="5" cy="-74" r="13.5" fill="#fff6e8"/><circle cx="12" cy="-70" r="5" fill="#ff9ec1"/><circle cx="-2" cy="-81" r="4" fill="#fff"/></g></g>
<g class="b"><path d="M0 0V28" stroke="${sk}" stroke-width="8" stroke-linecap="round"/><path d="M0 0V13" stroke="${tp}" stroke-width="11" stroke-linecap="round"/><g class="f"><path d="M0 0V26" stroke="${sk}" stroke-width="7" stroke-linecap="round"/><circle cy="27" r="4.5" fill="${sk}"/></g></g>
</g></g>`;
$('#chars').innerHTML=C('cm','#e0a47a','#2a1d16','#2f6fd0','#2b3a55',0)+C('cg','#f0b891','#5b2a1b','#ff7aa2','#fff0c2',1);
const E={};for(const p of 'mg'){const g=$('#c'+p),q=c=>g.querySelector('.'+c);E[p]={r:q('r'),ll:q('ll'),lk:q('lk'),rl:q('rl'),rk:q('rk'),a:q('a'),e:q('a .e'),b:q('b'),f:q('b .f'),mo:q('mo'),br:q('br'),cr:q('cr')}}
const MO=['M1 -67q5 5 9 -1','M3 -69a3.2 3.8 0 1 0 .01 0z','M1 -66h9'],BR=['M2 -82h9','M2 -83h9','M1 -85l10 4'];
// ---------- state / keyframes
const D={};for(const p of 'mg'){Object.assign(D,{[p+'x']:300,[p+'y']:252,[p+'r']:0,[p+'lf']:0,[p+'lk']:0,[p+'rf']:0,[p+'rk']:0,[p+'a']:4,[p+'e']:8,[p+'b']:6,[p+'f']:12,[p+'d']:1,[p+'mo']:0,[p+'cr']:0})}
Object.assign(D,{fx:520,fy:332,fr:0,fv:0,fa:0,cx:0,cy:0,cr:0,cv:0,ca:0,bx:0,by:0,br:0,bv:0,ba:0});
let K={},EV=[],st={},dur=8,cur=0,playing=0,ended=0,T0=0,ei=0,now=0,tt=0,init={};
const k=(key,...a)=>{for(let i=0;i<a.length;i+=2)(K[key]=K[key]||[]).push([a[i],a[i+1]])},ev=(u,f)=>EV.push([u,f]);
const cyc=(p,t0,t1,run,hold)=>{const per=run?.36:.8,A=run?48:22,N=run?62:25,R=run?42:14;for(let u=t0;u<=t1+1e-6;u+=per/8){const w=(u-t0)/per*6.2832,s=Math.sin(w),c=Math.cos(w);k(p+'lf',u,A*s);k(p+'rf',u,-A*s);k(p+'lk',u,6+N*Math.max(0,c));k(p+'rk',u,6+N*Math.max(0,-c));k(p+'y',u,252-(run?7:2)*Math.abs(c));if(!hold){k(p+'a',u,-R*s);k(p+'b',u,R*s);k(p+'e',u,run?85:14);k(p+'f',u,run?85:14)}}};
const nz=(p,u,arms)=>{['lf','rf','lk','rk'].forEach(n=>k(p+n,u,0));k(p+'y',u,252);if(arms){k(p+'a',u,4);k(p+'e',u,8);k(p+'b',u,6);k(p+'f',u,12)}};
const lau=(p,t0,t1,base=14)=>{for(let u=t0,i=0;u<t1;u+=.13,i++){k(p+'r',u,base+(i%2?6:-3));k(p+'y',u,252+(i%2?-5:0));k(p+'mo',u,1)}k(p+'r',t1,0);k(p+'y',t1,252);k(p+'mo',t1,0)};
const hop=(t0,x0,x1,h,n=6)=>{for(let i=0;i<=n;i++){const u=i/n;k('fx',t0+u*.55,x0+(x1-x0)*u);k('fy',t0+u*.55,332-h*4*u*(1-u));k('fr',t0+u*.55,(x1-x0)*u*.2)}};
function smp(key,t){const a=K[key];if(!a)return init[key]??D[key];let i=1;while(i<a.length&&a[i][0]<t)i++;if(i>=a.length||t<=a[0][0])return t<=a[0][0]?a[0][1]:a[a.length-1][1];const[t0,v0]=a[i-1],[t1,v1]=a[i];let u=(t-t0)/(t1-t0||1);if(t1-t0>.45)u=u*u*(3-2*u);return v0+(v1-v0)*u}
const rad=x=>x*Math.PI/180;
const hand=p=>{const d=st[p+'d']>0?1:-1,b=rad(st[p+'b']),f=rad(st[p+'b']+st[p+'f']),r=rad(st[p+'r']),lx=28*Math.sin(b)+26*Math.sin(f),ly=-52+28*Math.cos(b)+26*Math.cos(f);return[st[p+'x']+d*(lx*Math.cos(r)-ly*Math.sin(r)),st[p+'y']+lx*Math.sin(r)+ly*Math.cos(r)]};
const head=p=>{const d=st[p+'d']>0?1:-1,r=rad(st[p+'r']);return[st[p+'x']+d*87*Math.sin(r),st[p+'y']-87*Math.cos(r)]};
function render(t,idle){for(const key in D)st[key]=smp(key,t);
 if(st.fa>.5)[st.fx,st.fy]=head('m');
 if(st.ca>.5){const h=hand('g');st.cx=h[0];st.cy=h[1]-6}
 if(st.ba>.5){const h=hand('g');st.bx=h[0];st.by=h[1]+4}
 for(const p of 'mg'){const e=E[p],s=n=>st[p+n],d=s('d')>0?1:-1,y=s('y')+(idle?Math.sin(now/380+(p=='g')*2)*1.3:0);
  e.r.setAttribute('transform',`translate(${s('x')} ${y}) scale(${d} 1) rotate(${s('r')})`);
  e.ll.setAttribute('transform',`rotate(${-s('lf')})`);e.lk.setAttribute('transform',`translate(0 38) rotate(${s('lk')})`);
  e.rl.setAttribute('transform',`rotate(${-s('rf')})`);e.rk.setAttribute('transform',`translate(0 38) rotate(${s('rk')})`);
  e.a.setAttribute('transform',`translate(0 -52) rotate(${-s('a')})`);e.e.setAttribute('transform',`translate(0 28) rotate(${-s('e')})`);
  e.b.setAttribute('transform',`translate(0 -52) rotate(${-s('b')})`);e.f.setAttribute('transform',`translate(0 28) rotate(${-s('f')})`);
  const m=Math.max(0,Math.min(2,Math.round(s('mo'))));e.mo.setAttribute('d',MO[m]);e.br.setAttribute('d',BR[m]);e.cr.setAttribute('opacity',Math.max(0,Math.min(1,s('cr'))))}
 const sh=(id,x,y,r,s,v)=>{const n=$(id);n.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);n.style.display=v>.5?'':'none'};
 sh('#fr',st.fx,st.fy,st.fr,1.2,st.fv);sh('#ck',st.cx,st.cy,st.cr,1,st.cv);sh('#bk',st.bx,st.by,st.br,1,st.bv)}
// ---------- particles
let P=[],R=[];
const drops=(x,y,n,vx,vy,sp,c='#bfe9ff',g=900)=>{for(let i=0;i<n&&P.length<700;i++)P.push({x,y,vx:vx+(Math.random()-.5)*sp,vy:vy-Math.random()*sp,l:.7+Math.random()*.7,c,r:1.5+Math.random()*3,g})};
const rip=(x,y)=>R.push({x,y,r:6,a:.9});
const splash=(x,y,n)=>{for(let i=0;i<n&&P.length<700;i++){const a=-Math.PI*(.12+Math.random()*.76),s=120+Math.random()*340;P.push({x:x+(Math.random()-.5)*30,y,vx:Math.cos(a)*s*.6,vy:Math.sin(a)*s,l:.8+Math.random()*.8,c:Math.random()<.3?'#fff':'#a6e3ff',r:2+Math.random()*4,g:900})}rip(x,346);setTimeout(()=>rip(x+20,346),150);setTimeout(()=>rip(x-10,346),320)};
const cream=(x,y,n)=>drops(x,y,n,0,-120,420,'#fff4ea',700);
function fx(dt){const w=cv.clientWidth*devicePixelRatio;if(cv.width!=w){cv.width=w;cv.height=w*9/16}const sc=cv.width/800;ctx.setTransform(sc,0,0,sc,0,0);ctx.clearRect(0,0,800,450);
 P=P.filter(p=>(p.l-=dt)>0);for(const p of P){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 R=R.filter(r=>(r.a-=dt*.7)>0);ctx.lineWidth=2;for(const r of R){r.r+=dt*70;ctx.globalAlpha=r.a;ctx.strokeStyle='#fff';ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.25,0,0,7);ctx.stroke()}ctx.globalAlpha=1}
// ---------- sound
